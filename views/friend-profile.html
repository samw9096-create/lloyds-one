<div class="container">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
    <button class="avatar-btn" aria-label="Profile"></button>
  </header>

  <h1 class="page-title">Friend Profile</h1>

  <div class="card friend-profile-card">
    <div class="friend-profile-head">
      <div id="friendProfileAvatar" class="avatar-circle">?</div>
      <div>
        <div id="friendProfileName" style="font-weight:800;font-size:18px;">Friend</div>
        <div id="friendProfileHandle" class="muted">@friend</div>
      </div>
    </div>

    <div class="friend-profile-details">
      <div class="friend-profile-row">
        <span class="muted">Account name</span>
        <strong id="friendProfileAccountName">Friend</strong>
      </div>
      <div class="friend-profile-row">
        <span class="muted">Sort code</span>
        <strong id="friendProfileSortCode">12-34-56</strong>
      </div>
      <div class="friend-profile-row">
        <span class="muted">Account number</span>
        <strong id="friendProfileAccountNumber">•••• ••••</strong>
      </div>
      <div class="friend-profile-row">
        <span class="muted">Reference</span>
        <strong id="friendProfileReference">Use your name</strong>
      </div>
    </div>

    <div class="friend-profile-actions">
      <button id="friendProfileSendBtn" class="primary-btn" type="button">Send Money</button>
      <button id="friendProfileMessageBtn" class="action-btn" type="button">Message</button>
    </div>
  </div>
</div>

<div class="container">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
    <button class="avatar-btn" aria-label="Profile"></button>
  </header>

  <h1 class="page-title">Budget Pots</h1>

  <div id="potsGrid" class="pots-grid"></div>
  <div id="potsEmpty" class="muted" style="margin-top:10px;display:none;">No pots yet. Create your first pot.</div>

  <div class="balance-box">
    <div>
      <div id="potsTotal" style="font-weight:800;font-size:20px;">£0</div>
      <div style="font-size:12px;color:var(--muted);">Total balance</div>
    </div>
    <button id="moveMoneyBtn" class="primary-btn" type="button" style="width:auto;padding:10px 14px;">Move Money</button>
  </div>

  <div class="section">
    <button id="newPotBtn" class="primary-btn" type="button">+ New Pot</button>
  </div>
</div>

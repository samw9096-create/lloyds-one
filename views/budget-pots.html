<div class="container">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
    <button class="avatar-btn" aria-label="Profile"></button>
  </header>

  <h1 class="page-title">Budget Pots</h1>

  <div class="pots-grid">
    <div class="pot-card green">
      <div style="font-size:18px;">£12,256</div>
      <div style="font-size:12px;">46% of goal</div>
      <div style="margin-top:8px;">🏠 House Deposit</div>
    </div>
    <div class="pot-card blue">
      <div style="font-size:18px;">£3,456</div>
      <div style="font-size:12px;">70% of goal</div>
      <div style="margin-top:8px;">🚗 New Car</div>
    </div>
    <div class="pot-card purple">
      <div style="font-size:18px;">£789</div>
      <div style="font-size:12px;">Savings</div>
      <div style="margin-top:8px;">🐷 Savings</div>
    </div>
    <div class="pot-card blank">
      <div>+ New Pot</div>
    </div>
  </div>

  <div class="balance-box">
    <div>
      <div style="font-weight:800;font-size:20px;">£16,590</div>
      <div style="font-size:12px;color:var(--muted);">Total balance</div>
    </div>
    <button id="moveMoneyBtn" class="primary-btn" type="button" style="width:auto;padding:10px 14px;">Move Money</button>
  </div>

  <div class="section">
    <div style="font-weight:700;margin-bottom:8px;">Pots</div>
    <div class="card" style="padding:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <div><strong>House Deposit</strong></div>
        <div>£12,456 of £27,000 saved</div>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <div><strong>New Car</strong></div>
        <div>£3,456 of £5,000 saved</div>
      </div>
    </div>
  </div>
</div>

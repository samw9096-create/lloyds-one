<div class="container">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
    <button class="avatar-btn" aria-label="Profile"></button>
  </header>

  <h1 class="page-title">Add to Pot</h1>
  <p class="muted">Choose a pot and add money from your current account.</p>

  <div class="card" style="padding:12px;">
    <div class="form-field">
      <label>Pot</label>
      <select id="addPotSelect" class="input"></select>
    </div>
    <div class="form-field">
      <label>Amount</label>
      <input id="addPotAmount" class="input" type="number" min="0" step="10" placeholder="£0" />
      <div id="addPotLimitNote" class="muted" style="font-size:12px;margin-top:8px;"></div>
    </div>
  </div>

  <div class="section">
    <button id="addPotConfirm" class="primary-btn" type="button">Add Money</button>
  </div>
</div>

<div class="container unlock-page">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
  </header>

  <section class="unlock-shell">
    <div class="unlock-card">
      <div class="unlock-eyebrow">Secure return</div>
      <h1 class="page-title" style="margin-bottom:8px;">Enter passcode</h1>
      <div class="unlock-dots" aria-label="Passcode entry">
        <span class="unlock-dot"></span>
        <span class="unlock-dot"></span>
        <span class="unlock-dot"></span>
        <span class="unlock-dot"></span>
      </div>
      <div id="unlockErr" class="unlock-error"></div>
      <div id="unlockKeypad" class="unlock-keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button id="unlockFaceBtn" class="unlock-face-btn" type="button" aria-label="Use Face ID"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4H5.5A1.5 1.5 0 0 0 4 5.5V7M17 4h1.5A1.5 1.5 0 0 1 20 5.5V7M7 20H5.5A1.5 1.5 0 0 1 4 18.5V17M17 20h1.5a1.5 1.5 0 0 0 1.5-1.5V17M9 10h.01M15 10h.01M9 14c.7.9 1.74 1.4 3 1.4s2.3-.5 3-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-digit="0">0</button>
        <button id="unlockBackspace" class="unlock-backspace-btn" type="button" aria-label="Delete">⌫</button>
      </div>
      <button id="unlockSubmit" class="primary-btn unlock-submit" type="button">Submit</button>
    </div>
  </section>

  <div id="faceIdOverlay" class="faceid-overlay" aria-hidden="true">
    <div class="faceid-panel">
      <div class="faceid-ring"></div>
      <div class="faceid-head"></div>
      <div class="faceid-text">Scanning Face ID…</div>
    </div>
  </div>
</div>

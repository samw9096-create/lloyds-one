<div class="container">
  <header class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="./one-logo.png" alt="One" />
    </div>
    <button class="avatar-btn" aria-label="Profile"></button>
  </header>

  <div id="onboardStep1">
    <div class="onboard-hero">
      <h1>Welcome!</h1>
      <p>Pick your helper:</p>
    </div>

    <div class="helper-grid">
      <div class="helper-card" data-helper="louie">
        <img class="helper-img" src="./louie.png" alt="Louie" />
        <div><strong>Louie</strong></div>
      </div>
      <div class="helper-card" data-helper="lucy">
        <img class="helper-img" src="./lucy.png" alt="Lucy" />
        <div><strong>Lucy</strong></div>
      </div>
    </div>

    <div class="onboard-actions">
      <button id="onboardSkip" class="text-link" type="button">Skip</button>
      <button id="onboardNext" class="primary-btn" type="button">Next</button>
    </div>
  </div>

  <div id="onboardStep2" class="hidden">
    <h1>Tell us about you</h1>

    <div class="form-field">
      <label for="onboardName">Your name</label>
      <input id="onboardName" class="input" type="text" placeholder="Enter your name" />
    </div>

    <div class="form-field">
      <label for="onboardCompetency">How confident are you with finance?</label>
      <select id="onboardCompetency" class="input">
        <option value="">Select one</option>
        <option value="beginner">Beginner</option>
        <option value="comfortable">Comfortable</option>
        <option value="confident">Confident</option>
        <option value="expert">Expert</option>
      </select>
    </div>

    <p style="font-weight:700;">Pick 2 or more interests from below:</p>

    <div class="interest-grid">
      <div class="interest-card" data-interest="films">🎬 Films/TV</div>
      <div class="interest-card" data-interest="music">🎵 Music</div>
      <div class="interest-card" data-interest="days">☀️ Days out</div>
      <div class="interest-card" data-interest="food">🍴 Food</div>
      <div class="interest-card" data-interest="clothing">👕 Clothing</div>
      <div class="interest-card" data-interest="coffee">☕ Coffee</div>
      <div class="interest-card" data-interest="concerts">🎤 Concerts</div>
      <div class="interest-card" data-interest="tech">💻 Tech</div>
      <div class="interest-card" data-interest="gaming">🎮 Gaming</div>
      <div class="interest-card" data-interest="travel">✈️ Travel</div>
    </div>

    <p id="interestErr" style="color:#c63d3d;margin-top:12px;"></p>

    <div class="card" style="padding:12px;margin-top:12px;">
      <div style="font-weight:700;margin-bottom:8px;">Location permission</div>
      <div class="muted" style="font-size:13px;margin-bottom:10px;">Allow location so Deal Nest can prioritise nearby stores.</div>
      <button id="onboardLocationBtn" class="action-btn" type="button">Grant location access</button>
      <div id="onboardLocationStatus" class="muted" style="font-size:12px;margin-top:8px;"></div>
    </div>

    <div class="settings-item" style="margin-top:12px;">
      <label for="onboardTermsAccepted" style="margin:0;font-size:13px;font-weight:600;">I accept the Terms & Conditions</label>
      <input id="onboardTermsAccepted" class="switch" type="checkbox" />
    </div>

    <div class="onboard-actions" style="justify-content:flex-end;">
      <button id="onboardFinish" class="primary-btn" type="button">Finish →</button>
    </div>
  </div>
</div>

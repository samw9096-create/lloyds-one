<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lloyds One (Prototype)</title>

  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="icon" href="./tablogo.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0aa85d" />
</head>

<body>
  <div id="landing-message" style="padding:40px;text-align:center;max-width:760px;margin:0 auto;">
    <p style="font-size:18px;line-height:1.6;color:#1f1f1f;margin-bottom:24px;">
      The Lloyds One Prototype can be accessed here, due to it normally running on a local server.
    </p>
    <a id="openPrototype" class="primary-btn" href="https://samw9096-create.github.io/lloyds-one/" target="_blank" style="display:inline-block;padding:12px 20px;">Open Lloyds One Prototype</a>
  </div>
  <div id="app"></div>

  <script type="module" src="./assets/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        } catch (error) {
          console.error("Service worker cleanup failed", error);
        }

        if ("caches" in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          } catch (error) {
            console.error("Cache cleanup failed", error);
          }
        }
      });
    }
  </script>

</body>
</html>
